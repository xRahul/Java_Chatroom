name: Release

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build jars
        run: ./gradlew clean build -x test --no-daemon
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Assemble distributions
        run: ./gradlew :server:installDist :client:installDist --no-daemon
      - name: Package jars
        run: |
          mkdir -p dist
          cp server/build/libs/*.jar dist/ 2>/dev/null || true
          cp client/build/libs/*.jar dist/ 2>/dev/null || true
          ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Auto Release ${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
